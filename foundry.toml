[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
# `rhc` is Alchemy. Set RHC_RPC_URL in .env at the repo root (gitignored).
#
# The public RPC is NOT usable for forking: Cloudflare fingerprints
# Foundry's HTTP stack and returns a bot-challenge page instead of JSON,
# so `forge test --fork-url rhc` and `anvil --fork-url rhc` both fail
# against it. The same URL from a browser or curl is clean, which is why
# `rhc_public` is kept -- it is fine for cast reads and for Blockscout
# verification, which does not fork.
#
# If forge ever says it cannot resolve RHC_RPC_URL, the env var is not
# reaching it. Fix the env, do not point `rhc` back at the public URL.
rhc = "${RHC_RPC_URL}"
rhc_public = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
# Blockscout verification for chain 4663.
#
# Do NOT add `chain = 4663` here. Foundry validates that field against its
# own chain list and 4663 is not in it, so its presence makes EVERY forge
# command fail with "Error: Chain 4663 not supported" -- including
# `forge test`, which has nothing to do with verification.
#
# To verify after deploying:
#   forge verify-contract <addr> src/V3Adapter.sol:V3Adapter \
#     --verifier blockscout \
#     --verifier-url https://robinhoodchain.blockscout.com/api \
#     --rpc-url rhc
rhc = { key = "any", url = "https://robinhoodchain.blockscout.com/api" }
