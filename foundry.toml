[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
rhc = "https://rpc.mainnet.chain.robinhood.com"

# Fork tests run against chain 4663. The public RPC is rate-limited --
# if fork tests get flaky, swap in an Alchemy URL via env:
#   rhc = "${RHC_RPC_URL}"

[etherscan]
# Blockscout verification for chain 4663
rhc = { key = "any", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
